<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto — Alta Fidelidad · Rigma</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body { font-family: 'Montserrat', sans-serif; background: #d0d0d0; -webkit-font-smoothing: antialiased; }
    #root { max-width: 1440px; margin: 0 auto; background: #FBFBFB; box-shadow: 0 0 80px rgba(0,0,0,0.16); }
    input, textarea, select { font-family: 'Montserrat', sans-serif; outline: none; }
    button { font-family: 'Montserrat', sans-serif; }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // ── DESIGN TOKENS ─────────────────────────────────────────────────
    const t = {
      bg:            '#FBFBFB',
      bgWarm:        '#E3E3E3',
      surface:       '#E9E9E9',
      surfaceWarm:   '#CFC5BC',
      accent:        '#B59969',
      ink:           '#1E1E1E',
      inkElevated:   '#353631',
      textPrimary:   '#1E1E1E',
      textSecondary: 'rgba(30,30,30,0.65)',
      textTertiary:  'rgba(30,30,30,0.45)',
      line:          '#E9E9E9',
      onDarkPrimary:   '#FFFFFF',
      onDarkSecondary: 'rgba(255,255,255,0.65)',
      onDarkTertiary:  'rgba(255,255,255,0.45)',
      onDarkLine:      'rgba(255,255,255,0.15)',
    };

    // ── IMG CON FALLBACK ──────────────────────────────────────────────
    function Img({ src, alt = '', style = {} }) {
      const [err, setErr] = useState(false);
      if (err) return <Placeholder label={alt} style={style} />;
      return (
        <img src={src} alt={alt} onError={() => setErr(true)}
          style={{ objectFit: 'cover', display: 'block', ...style }} />
      );
    }

    // ── PLACEHOLDER ───────────────────────────────────────────────────
    function Placeholder({ label, style = {} }) {
      return (
        <div style={{
          background: `repeating-linear-gradient(135deg, ${t.surface} 0 14px, #d0d0d0 14px 15px)`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          ...style,
        }}>
          {label && (
            <span style={{
              fontSize: 10, fontWeight: 600, letterSpacing: '0.06em',
              color: t.textTertiary, background: 'rgba(255,255,255,0.88)',
              padding: '5px 14px', borderRadius: 2, textAlign: 'center', maxWidth: '80%',
            }}>
              {label}
            </span>
          )}
        </div>
      );
    }

    // ── SECTION LABEL ─────────────────────────────────────────────────
    function SectionLabel({ children, dark = false }) {
      return (
        <div style={{
          display: 'flex', alignItems: 'center', gap: 12,
          fontSize: 10, fontWeight: 600, letterSpacing: '0.2em',
          textTransform: 'uppercase',
          color: dark ? t.onDarkSecondary : t.textSecondary,
          marginBottom: 36,
        }}>
          <span style={{ width: 20, height: 1, background: t.accent, flexShrink: 0 }} />
          {children}
        </div>
      );
    }

    // ── LOGO ──────────────────────────────────────────────────────────
    function Logo({ size = 40, color = t.ink }) {
      const border = Math.round(size * 0.055);
      const fs     = Math.round(size * 0.4);
      const pad    = Math.round(size * 0.12);
      return (
        <div style={{
          width: size, height: size, flexShrink: 0,
          border: `${border}px solid ${color}`,
          display: 'flex', flexDirection: 'column', justifyContent: 'center',
          padding: `0 ${pad}px`, lineHeight: 1.05,
        }}>
          <div style={{ fontSize: fs, fontWeight: 500, letterSpacing: '-0.01em', color }}>RIG</div>
          <div style={{ fontSize: fs, fontWeight: 500, letterSpacing: '-0.01em', color }}>MA</div>
        </div>
      );
    }

    // ── HOVER LINK ────────────────────────────────────────────────────
    function HoverLink({ children, baseColor, baseBorder, style = {} }) {
      const [hov, setHov] = useState(false);
      return (
        <span
          onMouseEnter={() => setHov(true)}
          onMouseLeave={() => setHov(false)}
          style={{
            color: hov ? t.accent : baseColor,
            borderBottom: `1px solid ${hov ? t.accent : baseBorder}`,
            cursor: 'pointer',
            transition: 'color 0.2s ease, border-color 0.2s ease',
            ...style,
          }}
        >
          {children}
        </span>
      );
    }

    // ── NAVBAR ────────────────────────────────────────────────────────
    function NavBar() {
      const NAV_HREF = { INICIO: './index.html', PROYECTOS: './proyectos.html', NOSOTROS: './nosotros.html', CONTACTO: './contacto.html' };
      return (
        <nav style={{
          position: 'sticky', top: 0, zIndex: 100,
          height: 64,
          background: 'rgba(251,251,251,0.92)',
          backdropFilter: 'blur(14px)',
          WebkitBackdropFilter: 'blur(14px)',
          borderBottom: `1px solid ${t.line}`,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '0 56px',
        }}>
          <Logo size={40} color={t.ink} />
          <div style={{ display: 'flex', alignItems: 'center', gap: 40 }}>
            {['INICIO', 'PROYECTOS', 'NOSOTROS', 'CONTACTO'].map(link => (
              <a key={link} href={NAV_HREF[link]} style={{
                fontSize: 10, fontWeight: 600, letterSpacing: '0.12em',
                textTransform: 'uppercase',
                color: link === 'CONTACTO' ? t.ink : t.textSecondary,
                cursor: 'pointer',
                borderBottom: link === 'CONTACTO' ? `1.5px solid ${t.accent}` : '1.5px solid transparent',
                paddingBottom: 3, textDecoration: 'none',
              }}>
                {link}
              </a>
            ))}
          </div>
        </nav>
      );
    }

    // ── CONTACTO PAGE ─────────────────────────────────────────────────
    function ContactoPage() {
      const [hovSubmit, setHovSubmit] = useState(false);

      const fieldStyle = {
        width: '100%', padding: '13px 16px',
        fontSize: 13, fontWeight: 400,
        color: t.ink,
        background: 'transparent',
        border: `1px solid ${t.line}`,
        borderRadius: 2, appearance: 'none',
      };
      const labelStyle = {
        display: 'block', fontSize: 9, fontWeight: 700,
        letterSpacing: '0.16em', textTransform: 'uppercase',
        color: t.textTertiary, marginBottom: 8,
      };

      const channels = [
        {
          label: 'WhatsApp',
          value: '+54 11 6596 2401',
          icon: (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path fillRule="evenodd" clipRule="evenodd"
                d="M12 2C6.477 2 2 6.477 2 12c0 1.89.526 3.657 1.44 5.163L2 22l4.98-1.418A9.954 9.954 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm-1.45 5.5c-.18-.45-.37-.46-.54-.47-.14-.01-.3-.01-.46-.01-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.67 2.66 4.1 3.63.57.22 1.02.35 1.37.45.57.18 1.1.15 1.51.09.46-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.92-1.18-.71-.63-1.19-1.41-1.33-1.65-.14-.24-.015-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78z"
                fill={t.textSecondary}
              />
            </svg>
          ),
        },
        {
          label: 'Email',
          value: 'Rigmagrupo@gmail.com',
          icon: (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke={t.textSecondary} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <polyline points="3,5 12,13 21,5" />
            </svg>
          ),
        },
        {
          label: 'Oficina',
          value: 'Guardia Nacional 739, PB · CABA',
          icon: (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none"
              stroke={t.textSecondary} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
              <path d="M12 2C8.686 2 6 4.686 6 8c0 4.5 6 12 6 12s6-7.5 6-12c0-3.314-2.686-6-6-6z" />
              <circle cx="12" cy="8" r="2" />
            </svg>
          ),
        },
      ];

      return (
        <section style={{ borderTop: `1px solid ${t.line}` }}>
          <div style={{
            display: 'grid',
            gridTemplateColumns: '1fr 1fr',
            alignItems: 'stretch',
            minHeight: 'calc(100vh - 64px)',
          }}>

            {/* ── COLUMNA IZQUIERDA ── */}
            <div style={{
              padding: '48px 64px 48px 56px',
              display: 'flex', flexDirection: 'column',
              background: t.bg,
            }}>

              <h1 style={{
                fontSize: 66, fontWeight: 700, letterSpacing: '-0.02em',
                color: t.ink, lineHeight: 1, marginBottom: 14,
              }}>
                Hablemos.
              </h1>
              <p style={{
                fontSize: 14, fontWeight: 300, lineHeight: 1.65,
                color: t.textSecondary, marginBottom: 40, maxWidth: 460,
              }}>
                Escribinos para consultar sobre proyectos, coordinar
                una visita o pedir información personalizada.
              </p>

              {/* Formulario */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: 16 }}>
                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
                  <div>
                    <label style={labelStyle}>Nombre completo</label>
                    <input type="text" placeholder="Ej: María González" style={fieldStyle} />
                  </div>
                  <div>
                    <label style={labelStyle}>Celular</label>
                    <input type="text" placeholder="+54 11 ···· ····" style={fieldStyle} />
                  </div>
                </div>
                <div>
                  <label style={labelStyle}>Email</label>
                  <input type="email" placeholder="nombre@email.com" style={fieldStyle} />
                </div>
                <div>
                  <label style={labelStyle}>Proyecto de interés</label>
                  <select style={{ ...fieldStyle, color: t.textSecondary }} defaultValue="">
                    <option value="" disabled>Seleccioná un proyecto</option>
                    <option value="cosquin">Cosquín 1534</option>
                    <option value="larrazabal">Av. Larrazábal 1255</option>
                    <option value="zelada">Zelada 6171</option>
                    <option value="otro">Otro / No sé aún</option>
                  </select>
                </div>
                <div>
                  <label style={labelStyle}>Mensaje</label>
                  <textarea
                    placeholder="Contanos qué información necesitás..."
                    rows={4}
                    style={{ ...fieldStyle, resize: 'none', overflow: 'hidden' }}
                    onInput={e => { e.target.style.height = 'auto'; e.target.style.height = e.target.scrollHeight + 'px'; }}
                  />
                </div>
                <button
                  onMouseEnter={() => setHovSubmit(true)}
                  onMouseLeave={() => setHovSubmit(false)}
                  style={{
                    width: '100%', padding: '15px 24px',
                    fontSize: 11, fontWeight: 700, letterSpacing: '0.16em', textTransform: 'uppercase',
                    background: hovSubmit ? t.accent : t.ink,
                    color: t.onDarkPrimary,
                    border: 'none', cursor: 'pointer', borderRadius: 2,
                    transition: 'background 0.2s ease',
                  }}>
                  ENVIAR CONSULTA
                </button>
              </div>

              {/* Canales de contacto */}
              <div style={{
                marginTop: 32, paddingTop: 24,
                borderTop: `1px solid ${t.line}`,
                display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: 24,
              }}>
                {channels.map((ch, i) => (
                  <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
                    <div style={{ flexShrink: 0, marginTop: 1 }}>{ch.icon}</div>
                    <div>
                      <div style={{
                        fontSize: 9, fontWeight: 700, letterSpacing: '0.16em',
                        textTransform: 'uppercase', color: t.textTertiary, marginBottom: 5,
                      }}>
                        {ch.label}
                      </div>
                      <div style={{ fontSize: 12, fontWeight: 500, color: t.ink, lineHeight: 1.5 }}>
                        {ch.value}
                      </div>
                    </div>
                  </div>
                ))}
              </div>

            </div>

            {/* ── COLUMNA DERECHA: imagen a sangre ── */}
            <div style={{ padding: '48px 56px 48px 0', boxSizing: 'border-box', height: '100%' }}>
              <div style={{ position: 'relative', overflow: 'hidden', height: '100%' }}>
                <Img
                  src="./assets/img-2.jpg"
                  alt="foto · equipo / obra / empresa"
                  style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }}
                />
              </div>
            </div>

          </div>
        </section>
      );
    }

    // ── FOOTER ────────────────────────────────────────────────────────
    function Footer() {
      return (
        <footer style={{ background: t.ink, borderTop: `1px solid ${t.onDarkLine}`, padding: '60px 56px 40px' }}>
          <div style={{ display: 'grid', gridTemplateColumns: '1.6fr 1fr 1fr', gap: 48, marginBottom: 56 }}>
            <div>
              <div style={{ marginBottom: 24 }}><Logo size={44} color="rgba(255,255,255,0.85)" /></div>
              <p style={{ fontSize: 13, fontWeight: 300, lineHeight: 2, color: t.onDarkSecondary, marginBottom: 16 }}>
                Guardia Nacional 739, PB<br />Ciudad de Buenos Aires
              </p>
              <p style={{ fontSize: 13, fontWeight: 400, lineHeight: 1.9, color: t.onDarkSecondary }}>
                Rigmagrupo@gmail.com<br />+54 11 6596 2401
              </p>
            </div>
            <div>
              <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: '0.18em', textTransform: 'uppercase', color: t.onDarkTertiary, marginBottom: 22 }}>Proyectos</div>
              {['Cosquín 1534', 'Av. Larrazábal 1255', 'Zelada 6171'].map(p => (
                <div key={p} style={{ fontSize: 12, fontWeight: 400, color: t.onDarkSecondary, marginBottom: 12, cursor: 'pointer' }}>{p}</div>
              ))}
            </div>
            <div>
              <div style={{ fontSize: 9, fontWeight: 700, letterSpacing: '0.18em', textTransform: 'uppercase', color: t.onDarkTertiary, marginBottom: 22 }}>Empresa</div>
              {['Inicio', 'Nosotros', 'Proyectos', 'Contacto'].map(l => (
                <div key={l} style={{ fontSize: 12, fontWeight: 400, color: t.onDarkSecondary, marginBottom: 12, cursor: 'pointer' }}>{l}</div>
              ))}
            </div>
          </div>
          <div style={{
            paddingTop: 24, borderTop: `1px solid ${t.onDarkLine}`,
            display: 'flex', justifyContent: 'space-between', alignItems: 'center',
          }}>
            <span style={{ fontSize: 10, fontWeight: 400, color: t.onDarkTertiary, letterSpacing: '0.06em' }}>
              © 2026 Rigma Group · Todos los derechos reservados
            </span>
            <span style={{ fontSize: 10, fontWeight: 600, letterSpacing: '0.12em', textTransform: 'uppercase', color: t.accent }}>
              Viví diferente, viví RIGMA
            </span>
          </div>
        </footer>
      );
    }

    // ── APP ───────────────────────────────────────────────────────────
    function App() {
      return (
        <div style={{ fontFamily: "'Montserrat', sans-serif", background: t.bg }}>
          <NavBar />
          <ContactoPage />
          <Footer />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
