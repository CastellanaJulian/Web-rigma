<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contacto — Wireframe · Rigma</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f0f0f0;
      -webkit-font-smoothing: antialiased;
    }
    #root { max-width: 1440px; margin: 0 auto; background: #ffffff; box-shadow: 0 0 60px rgba(0,0,0,0.12); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">

    // ── DESIGN TOKENS ─────────────────────────────────────────────────
    const t = {
      bg:       '#ffffff',
      ink:      '#171717',
      ink2:     '#404040',
      muted:    '#737373',
      line:     '#e5e5e5',
      line2:    '#d4d4d4',
      surface:  '#fafafa',
      surface2: '#f5f5f5',
    };

    // ── SECTION LABEL ─────────────────────────────────────────────────
    function SectionLabel({ children, dark = false }) {
      const color = dark ? 'rgba(255,255,255,0.45)' : t.muted;
      return (
        <div style={{
          display: 'flex', alignItems: 'center', gap: 12,
          fontSize: 10, fontWeight: 600, letterSpacing: '0.2em',
          textTransform: 'uppercase', color,
          marginBottom: 36,
        }}>
          <span style={{ width: 20, height: 1, background: color, flexShrink: 0 }} />
          {children}
        </div>
      );
    }

    // ── LOGO ──────────────────────────────────────────────────────────
    function Logo({ size = 40, color = t.ink }) {
      const border   = Math.round(size * 0.055);
      const fontSize = Math.round(size * 0.4);
      const pad      = Math.round(size * 0.1);
      return (
        <div style={{
          width: size, height: size, flexShrink: 0,
          border: `${border}px solid ${color}`,
          display: 'flex', flexDirection: 'column', justifyContent: 'center',
          padding: `0 ${pad}px`, lineHeight: 1.05,
        }}>
          <div style={{ fontSize, fontWeight: 500, letterSpacing: '-0.01em', color, fontFamily: "'Montserrat', sans-serif" }}>RIG</div>
          <div style={{ fontSize, fontWeight: 500, letterSpacing: '-0.01em', color, fontFamily: "'Montserrat', sans-serif" }}>MA</div>
        </div>
      );
    }

    // ── NAVBAR ────────────────────────────────────────────────────────
    function NavBar() {
      return (
        <nav style={{
          position: 'sticky', top: 0, zIndex: 100,
          height: 64, background: 'rgba(255,255,255,0.96)',
          borderBottom: `1px solid ${t.line}`,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '0 56px',
        }}>
          <Logo size={40} color={t.ink} />
          <div style={{ display: 'flex', alignItems: 'center', gap: 40 }}>
            {['INICIO', 'PROYECTOS', 'NOSOTROS', 'CONTACTO'].map(link => (
              <span key={link} style={{
                fontSize: 10, fontWeight: 600, letterSpacing: '0.12em',
                textTransform: 'uppercase',
                color: link === 'CONTACTO' ? t.ink : t.muted,
                cursor: 'pointer',
                borderBottom: link === 'CONTACTO' ? `1.5px solid ${t.ink}` : '1.5px solid transparent',
                paddingBottom: 3,
              }}>
                {link}
              </span>
            ))}
          </div>
        </nav>
      );
    }

    // ── PLACEHOLDER ───────────────────────────────────────────────────
    function Placeholder({ label, style = {} }) {
      return (
        <div style={{
          background: `repeating-linear-gradient(135deg, ${t.surface2} 0 14px, ${t.line2} 14px 15px)`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          position: 'relative', overflow: 'hidden',
          ...style,
        }}>
          {label && (
            <span style={{
              fontFamily: "'Montserrat', sans-serif",
              fontSize: 10, fontWeight: 600, letterSpacing: '0.04em',
              color: t.muted,
              background: 'rgba(255,255,255,0.82)',
              padding: '5px 12px', borderRadius: 2,
            }}>
              {label}
            </span>
          )}
        </div>
      );
    }

    // ── MAIN SECTION (split: contenido izquierda + imagen derecha a sangre) ──
    function MainSection() {
      const fieldStyle = {
        width: '100%', padding: '12px 14px',
        fontSize: 13, fontWeight: 400, color: t.ink,
        background: t.bg, border: `1px solid ${t.line2}`,
        borderRadius: 2, appearance: 'none',
        fontFamily: "'Montserrat', sans-serif",
      };
      const labelStyle = {
        display: 'block', fontSize: 9, fontWeight: 700,
        letterSpacing: '0.14em', textTransform: 'uppercase',
        color: t.muted, marginBottom: 8,
        fontFamily: "'Montserrat', sans-serif",
      };

      const channels = [
        {
          label: 'WhatsApp',
          value: '+54 11 6596 2401',
          icon: (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
              <path fillRule="evenodd" clipRule="evenodd"
                d="M12 2C6.477 2 2 6.477 2 12c0 1.89.526 3.657 1.44 5.163L2 22l4.98-1.418A9.954 9.954 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm-1.45 5.5c-.18-.45-.37-.46-.54-.47-.14-.01-.3-.01-.46-.01-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.67 2.66 4.1 3.63.57.22 1.02.35 1.37.45.57.18 1.1.15 1.51.09.46-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.92-1.18-.71-.63-1.19-1.41-1.33-1.65-.14-.24-.015-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78z"
                fill={t.muted}
              />
            </svg>
          ),
        },
        {
          label: 'Email',
          value: 'Rigmagrupo@gmail.com',
          icon: (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={t.muted} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
              <rect x="3" y="5" width="18" height="14" rx="2" />
              <polyline points="3,5 12,13 21,5" />
            </svg>
          ),
        },
        {
          label: 'Oficina',
          value: 'Guardia Nacional 739, PB · CABA',
          icon: (
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={t.muted} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
              <path d="M12 2C8.686 2 6 4.686 6 8c0 4.5 6 12 6 12s6-7.5 6-12c0-3.314-2.686-6-6-6z" />
              <circle cx="12" cy="8" r="2" />
            </svg>
          ),
        },
      ];

      return (
        <section style={{ borderTop: `1px solid ${t.line}` }}>
          <div style={{
            display: 'grid',
            gridTemplateColumns: '1fr 1fr',
            alignItems: 'stretch',
            minHeight: 'calc(100vh - 65px)',
          }}>

            {/* ── COLUMNA IZQUIERDA: encabezado + formulario + canales ── */}
            <div style={{ padding: '48px 64px 48px 56px', display: 'flex', flexDirection: 'column' }}>

              <h1 style={{
                fontSize: 44, fontWeight: 700, letterSpacing: '-0.02em',
                color: t.ink, lineHeight: 1, marginBottom: 10,
              }}>
                Hablemos.
              </h1>
              <p style={{
                fontSize: 14, fontWeight: 300, lineHeight: 1.6,
                color: t.ink2, marginBottom: 24,
              }}>
                Escribinos para consultar sobre proyectos, coordinar
                una visita o pedir información personalizada.
              </p>

              {/* Formulario */}
              <div style={{ display: 'flex', flexDirection: 'column', gap: 14 }}>

                <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 12 }}>
                  <div>
                    <label style={labelStyle}>Nombre completo</label>
                    <input type="text" placeholder="Ej: María González" style={fieldStyle} readOnly />
                  </div>
                  <div>
                    <label style={labelStyle}>Celular</label>
                    <input type="text" placeholder="+54 11 ···· ····" style={fieldStyle} readOnly />
                  </div>
                </div>

                <div>
                  <label style={labelStyle}>Email</label>
                  <input type="email" placeholder="nombre@email.com" style={fieldStyle} readOnly />
                </div>

                <div>
                  <label style={labelStyle}>Proyecto de interés</label>
                  <select style={{ ...fieldStyle, color: t.ink }} defaultValue="">
                    <option value="" disabled>Seleccioná un proyecto</option>
                    <option value="cosquin">Cosquín 1534</option>
                    <option value="larrazabal">Av. Larrazábal 1255</option>
                    <option value="zelada">Zelada 6171</option>
                    <option value="otro">Otro / No sé aún</option>
                  </select>
                </div>

                <div>
                  <label style={labelStyle}>Mensaje</label>
                  <textarea
                    placeholder="Contanos qué información necesitás..."
                    rows={2}
                    style={{ ...fieldStyle, resize: 'vertical' }}
                    readOnly
                  />
                </div>

                <div>
                  <button style={{
                    padding: '14px 24px',
                    fontSize: 11, fontWeight: 700, letterSpacing: '0.12em', textTransform: 'uppercase',
                    background: t.ink, color: '#ffffff',
                    border: 'none', cursor: 'pointer', borderRadius: 2,
                    fontFamily: "'Montserrat', sans-serif",
                  }}>
                    ENVIAR CONSULTA
                  </button>
                </div>

              </div>

              {/* ── Canales de contacto debajo del form ── */}
              <div style={{
                marginTop: 24,
                paddingTop: 20,
                borderTop: `1px solid ${t.line}`,
                display: 'grid',
                gridTemplateColumns: 'repeat(3, 1fr)',
                gap: 24,
              }}>
                {channels.map((ch, i) => (
                  <div key={i} style={{ display: 'flex', alignItems: 'flex-start', gap: 10 }}>
                    <div style={{ marginTop: 1, flexShrink: 0 }}>{ch.icon}</div>
                    <div>
                      <div style={{
                        fontSize: 9, fontWeight: 700, letterSpacing: '0.14em',
                        textTransform: 'uppercase', color: t.muted, marginBottom: 4,
                      }}>
                        {ch.label}
                      </div>
                      <div style={{ fontSize: 12, fontWeight: 500, color: t.ink2, lineHeight: 1.4 }}>
                        {ch.value}
                      </div>
                    </div>
                  </div>
                ))}
              </div>

            </div>

            {/* ── COLUMNA DERECHA: imagen a sangre ── */}
            <Placeholder
              label="foto · equipo / obra / empresa"
              style={{ height: '100%', minHeight: 600 }}
            />

          </div>
        </section>
      );
    }

    // ── FOOTER ────────────────────────────────────────────────────────
    function Footer() {
      return (
        <footer style={{ background: t.ink, padding: '56px 56px 40px' }}>
          <div style={{
            display: 'grid', gridTemplateColumns: '1.4fr 1fr 1fr 1fr',
            gap: 48, marginBottom: 48,
          }}>
            <div>
              <div style={{ marginBottom: 20 }}>
                <Logo size={44} color="rgba(255,255,255,0.85)" />
              </div>
              <div style={{
                fontSize: 12, fontWeight: 300, lineHeight: 1.9,
                color: 'rgba(255,255,255,0.5)',
              }}>
                Guardia Nacional 739, PB<br />
                Ciudad de Buenos Aires
              </div>
            </div>
            <div>
              <div style={{
                fontSize: 9, fontWeight: 700, letterSpacing: '0.16em',
                textTransform: 'uppercase', color: 'rgba(255,255,255,0.35)', marginBottom: 20,
              }}>
                Proyectos
              </div>
              {['Cosquín 1534', 'Av. Larrazábal 1255', 'Zelada 6171'].map(p => (
                <div key={p} style={{
                  fontSize: 12, fontWeight: 400, color: 'rgba(255,255,255,0.6)',
                  marginBottom: 10, cursor: 'pointer',
                }}>
                  {p}
                </div>
              ))}
            </div>
            <div>
              <div style={{
                fontSize: 9, fontWeight: 700, letterSpacing: '0.16em',
                textTransform: 'uppercase', color: 'rgba(255,255,255,0.35)', marginBottom: 20,
              }}>
                Empresa
              </div>
              {['Inicio', 'Nosotros', 'Proyectos', 'Contacto'].map(l => (
                <div key={l} style={{
                  fontSize: 12, fontWeight: 400, color: 'rgba(255,255,255,0.6)',
                  marginBottom: 10, cursor: 'pointer',
                }}>
                  {l}
                </div>
              ))}
            </div>
            <div>
              <div style={{
                fontSize: 9, fontWeight: 700, letterSpacing: '0.16em',
                textTransform: 'uppercase', color: 'rgba(255,255,255,0.35)', marginBottom: 20,
              }}>
                Contacto
              </div>
              <div style={{
                fontSize: 12, fontWeight: 300, lineHeight: 2,
                color: 'rgba(255,255,255,0.6)', marginBottom: 16,
              }}>
                Rigmagrupo@gmail.com
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                  <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 1.89.526 3.657 1.44 5.163L2 22l4.98-1.418A9.954 9.954 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm-1.45 5.5c-.18-.45-.37-.46-.54-.47-.14-.01-.3-.01-.46-.01-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.67 2.66 4.1 3.63.57.22 1.02.35 1.37.45.57.18 1.1.15 1.51.09.46-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.92-1.18-.71-.63-1.19-1.41-1.33-1.65-.14-.24-.015-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78z" fill="rgba(255,255,255,0.5)"/>
                </svg>
                <span style={{ fontSize: 12, fontWeight: 400, color: 'rgba(255,255,255,0.6)' }}>
                  WhatsApp
                </span>
              </div>
            </div>
          </div>
          <div style={{
            paddingTop: 24, borderTop: '1px solid rgba(255,255,255,0.08)',
            fontSize: 10, fontWeight: 400, color: 'rgba(255,255,255,0.25)',
            letterSpacing: '0.06em',
          }}>
            © 2026 Rigma Group · Todos los derechos reservados
          </div>
        </footer>
      );
    }

    // ── APP ───────────────────────────────────────────────────────────
    function App() {
      return (
        <div style={{ fontFamily: "'Montserrat', sans-serif", background: t.bg }}>
          <NavBar />
          <MainSection />
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    /*
    ── DECISIONES DE ESTE WIREFRAME ───────────────────────────────────
    Sesión: 12/5/2026.

    Estructura:
      NavBar (CONTACTO activo) → MainSection (split) → Footer

    MainSection — layout split 2 columnas:
      - Izquierda (1fr): SectionLabel + H1 "Hablemos." 56px + subtítulo 300 + formulario completo.
      - Derecha (340px, sticky top 88px): SectionLabel "Vías de contacto" + 3 canales apilados.
      - Gap entre columnas: 96px. Padding sección: 80px 56px 120px.
      - Los canales quedan visibles en el primer viewport sin scroll.

    Formulario (columna izquierda):
      - Campos: Nombre + Celular (grid 1fr 1fr) / Email / Proyecto (select) / Mensaje / Submit.
      - Select incluye los 3 proyectos reales + "Otro / No sé aún".
      - Nota de privacidad debajo del botón.

    Canales (columna derecha, sticky):
      - Apilados verticalmente, icon inline 24px + label uppercase 9px + value 14px 600 + sub 12px muted.
      - Separados por border-top line. Sin fondo diferenciado (bg blanco).
      - WhatsApp (+54 11 6596 2401) · Email (Rigmagrupo@gmail.com) · Oficina (Guardia Nacional 739, PB).
      - Sin horarios (pendiente de confirmar con el cliente).

    Pendiente: horarios de atención de la oficina — si el cliente los confirma, se suman
    debajo del sub de la columna "Oficina".
    */
  </script>
</body>
</html>
