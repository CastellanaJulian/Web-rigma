<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Proyectos — Wireframe · Rigma</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f0f0f0;
      -webkit-font-smoothing: antialiased;
    }
    #root { max-width: 1440px; margin: 0 auto; background: #ffffff; box-shadow: 0 0 60px rgba(0,0,0,0.12); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // ── DESIGN TOKENS ─────────────────────────────────────────────────
    const t = {
      bg:       '#ffffff',
      ink:      '#171717',
      ink2:     '#404040',
      muted:    '#737373',
      line:     '#e5e5e5',
      line2:    '#d4d4d4',
      surface:  '#fafafa',
      surface2: '#f5f5f5',
    };

    // ── PROYECTOS (datos canónicos — fuente: CLAUDE.md + wireframes-system.md)
    const ALL_PROJECTS = [
      {
        id:     'cosquin',
        name:   'Cosquín 1534',
        loc:    'Mataderos',
        status: 'En Ejecución',
        year:   'Dic 2026',
        label:  'render · cosquín 1534',
      },
      {
        id:     'larrazabal',
        name:   'Av. Larrazábal 1255',
        loc:    'Mataderos',
        status: 'En Ejecución',
        year:   'TBD',
        label:  'render · av. larrazábal 1255',
      },
      {
        id:     'zelada',
        name:   'Zelada 6171',
        loc:    'Mataderos',
        status: 'Terminado',
        year:   'Entregado 2025',
        label:  'foto · zelada 6171',
      },
      // filler — usar hasta que el cliente entregue el 4to proyecto real
      {
        id:     'murguiondo',
        name:   'Murguiondo 2034',
        loc:    'Mataderos',
        status: 'Terminado',
        year:   '2024',
        label:  'foto · murguiondo 2034',
      },
      // filler
      {
        id:     'cafayate',
        name:   'Cafayate 1820',
        loc:    'Mataderos',
        status: 'Terminado',
        year:   '2023',
        label:  'foto · cafayate 1820',
      },
    ];

    // ── FILTROS ───────────────────────────────────────────────────────
    const FILTERS = [
      { id: 'todos',        label: 'Todos' },
      { id: 'en-ejecucion', label: 'En ejecución' },
      { id: 'terminados',   label: 'Terminados' },
    ];

    function filterProjects(projects, filter) {
      if (filter === 'en-ejecucion') return projects.filter(p => p.status === 'En Ejecución');
      if (filter === 'terminados')   return projects.filter(p => p.status === 'Terminado');
      return projects;
    }

    // LG cuando el filtro enfoca en ejecución, o en "todos" si el proyecto está en ejecución.
    function getCardSize(project, filter) {
      if (filter === 'terminados')   return 'md';
      if (filter === 'en-ejecucion') return 'lg';
      return project.status === 'En Ejecución' ? 'lg' : 'md';
    }

    // ── PLACEHOLDER (striped) ─────────────────────────────────────────
    function Placeholder({ label, style = {} }) {
      return (
        <div style={{
          background: `repeating-linear-gradient(135deg, ${t.surface2} 0 14px, ${t.line2} 14px 15px)`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          position: 'relative', overflow: 'hidden',
          ...style,
        }}>
          {label && (
            <span style={{
              fontFamily: "'Montserrat', sans-serif",
              fontSize: 10, fontWeight: 600,
              letterSpacing: '0.04em',
              color: t.muted,
              background: 'rgba(255,255,255,0.82)',
              padding: '5px 12px', borderRadius: 2,
              textAlign: 'center', maxWidth: '80%',
            }}>
              {label}
            </span>
          )}
        </div>
      );
    }

    // ── SECTION LABEL ─────────────────────────────────────────────────
    function SectionLabel({ children }) {
      return (
        <div style={{
          display: 'flex', alignItems: 'center', gap: 12,
          fontSize: 10, fontWeight: 600, letterSpacing: '0.2em',
          textTransform: 'uppercase', color: t.muted,
          marginBottom: 36,
        }}>
          <span style={{ width: 20, height: 1, background: t.muted, flexShrink: 0 }} />
          {children}
        </div>
      );
    }

    // ── STATUS PILL ───────────────────────────────────────────────────
    function StatusPill({ status, dark = false }) {
      return (
        <span style={{
          display: 'inline-flex', alignItems: 'center', gap: 7,
          fontSize: 10, fontWeight: 600, letterSpacing: '0.12em', textTransform: 'uppercase',
          padding: '5px 12px',
          border: dark ? '1px solid rgba(255,255,255,0.35)' : `1px solid ${t.line2}`,
          background: dark ? 'rgba(255,255,255,0.12)' : t.surface,
          color: dark ? '#ffffff' : t.ink2,
          borderRadius: 2,
        }}>
          <span style={{
            width: 6, height: 6, borderRadius: '50%',
            background: dark ? 'rgba(255,255,255,0.75)' : t.muted,
            flexShrink: 0,
          }} />
          {status}
        </span>
      );
    }

    // ── LOGO ──────────────────────────────────────────────────────────
    function Logo({ size = 40, color = t.ink }) {
      const border   = Math.round(size * 0.055);
      const fontSize = Math.round(size * 0.4);
      const pad      = Math.round(size * 0.1);
      return (
        <div style={{
          width: size, height: size, flexShrink: 0,
          border: `${border}px solid ${color}`,
          display: 'flex', flexDirection: 'column', justifyContent: 'center',
          padding: `0 ${pad}px`, lineHeight: 1.05,
        }}>
          <div style={{ fontSize, fontWeight: 500, letterSpacing: '-0.01em', color, fontFamily: "'Montserrat', sans-serif" }}>RIG</div>
          <div style={{ fontSize, fontWeight: 500, letterSpacing: '-0.01em', color, fontFamily: "'Montserrat', sans-serif" }}>MA</div>
        </div>
      );
    }

    // ── NAVBAR ────────────────────────────────────────────────────────
    function NavBar() {
      return (
        <nav style={{
          position: 'sticky', top: 0, zIndex: 100,
          height: 64, background: 'rgba(255,255,255,0.96)',
          borderBottom: `1px solid ${t.line}`,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '0 56px',
        }}>
          <Logo size={40} color={t.ink} />
          <div style={{ display: 'flex', alignItems: 'center', gap: 40 }}>
            {['INICIO', 'PROYECTOS', 'NOSOTROS', 'CONTACTO'].map(link => (
              <span key={link} style={{
                fontSize: 10, fontWeight: 600, letterSpacing: '0.12em',
                textTransform: 'uppercase',
                color: link === 'PROYECTOS' ? t.ink : t.muted,
                cursor: 'pointer',
                borderBottom: link === 'PROYECTOS' ? `1.5px solid ${t.ink}` : '1.5px solid transparent',
                paddingBottom: 3,
              }}>
                {link}
              </span>
            ))}
          </div>
        </nav>
      );
    }

    // ── PAGE HEADER ───────────────────────────────────────────────────
    function PageHeader() {
      return (
        <section style={{ padding: '80px 56px 64px' }}>
          <SectionLabel>Proyectos</SectionLabel>
          <h1 style={{
            fontSize: 56, fontWeight: 700, letterSpacing: '-0.02em',
            color: t.ink, lineHeight: 1, marginBottom: 20,
          }}>
            Nuestros proyectos
          </h1>
          <p style={{ fontSize: 16, fontWeight: 300, lineHeight: 1.6, color: t.ink2, maxWidth: 520 }}>
            Lo que estamos construyendo y lo que ya entregamos.
            Cada proyecto, un estándar de calidad y cumplimiento.
          </p>
        </section>
      );
    }

    // ── FILTER TABS ───────────────────────────────────────────────────
    function FilterTabs({ active, onChange }) {
      return (
        <div style={{ padding: '0 56px', borderBottom: `1px solid ${t.line}` }}>
          <div style={{ display: 'flex', gap: 40 }}>
            {FILTERS.map(f => {
              const isActive = f.id === active;
              return (
                <button
                  key={f.id}
                  onClick={() => onChange(f.id)}
                  style={{
                    background: 'none', border: 'none', cursor: 'pointer',
                    padding: '0 0 16px',
                    fontSize: 11, fontWeight: isActive ? 600 : 500,
                    letterSpacing: '0.12em', textTransform: 'uppercase',
                    color: isActive ? t.ink : t.muted,
                    borderBottom: isActive ? `2px solid ${t.ink}` : '2px solid transparent',
                    marginBottom: -1,
                    fontFamily: "'Montserrat', sans-serif",
                    transition: 'color 0.15s',
                  }}
                >
                  {f.label}
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    // ── PROJECT CARD (LG + MD en un solo componente) ──────────────────
    // LG: span 3 en grilla de 6 → 2 cards por fila
    // MD: span 2 en grilla de 6 → 3 cards por fila
    function ProjectCard({ project, size }) {
      const isLg = size === 'lg';
      const pillLabel = project.status === 'En Ejecución' ? 'EN EJECUCIÓN' : 'TERMINADO';

      return (
        <div style={{
          position: 'relative', cursor: 'pointer', overflow: 'hidden',
          gridColumn: isLg ? 'span 3' : 'span 2',
          height: isLg ? 460 : undefined,
          aspectRatio: isLg ? undefined : '4/5',
        }}>
          {/* Imagen / render / foto placeholder */}
          <Placeholder
            label={project.label}
            style={{ position: 'absolute', inset: 0 }}
          />

          {/* Overlay gradiente */}
          <div style={{
            position: 'absolute', inset: 0,
            background: isLg
              ? 'linear-gradient(to top, rgba(23,23,23,0.80) 0%, rgba(23,23,23,0.15) 55%, transparent 100%)'
              : 'linear-gradient(to top, rgba(23,23,23,0.82) 0%, rgba(23,23,23,0.10) 65%, transparent 100%)',
          }} />

          {/* Contenido sobre overlay */}
          <div style={{
            position: 'absolute', bottom: 0, left: 0, right: 0,
            padding: isLg ? '0 48px 36px' : '0 20px 20px',
          }}>
            <div style={{ marginBottom: isLg ? 14 : 10 }}>
              <StatusPill status={pillLabel} dark />
            </div>
            <h2 style={{
              fontSize: isLg ? 48 : 18,
              fontWeight: isLg ? 700 : 600,
              letterSpacing: isLg ? '-0.01em' : '0.01em',
              textTransform: 'uppercase',
              color: '#ffffff',
              lineHeight: isLg ? 1 : 1.1,
              marginBottom: isLg ? 8 : 6,
            }}>
              {project.name}
            </h2>
            <p style={{
              fontSize: isLg ? 12 : 10,
              fontWeight: 400, letterSpacing: '0.08em',
              textTransform: 'uppercase',
              color: 'rgba(255,255,255,0.6)',
              marginBottom: isLg ? 22 : 14,
            }}>
              {project.loc}
            </p>
            <div style={{
              display: 'inline-flex', alignItems: 'center', gap: 8,
              fontSize: 10, fontWeight: 700, letterSpacing: '0.12em',
              textTransform: 'uppercase', color: '#ffffff',
              borderBottom: '1px solid rgba(255,255,255,0.4)', paddingBottom: 2,
            }}>
              VER PROYECTO →
            </div>
          </div>
        </div>
      );
    }

    // ── EMPTY STATE ───────────────────────────────────────────────────
    function EmptyState() {
      return (
        <div style={{
          padding: '96px 0', display: 'flex', flexDirection: 'column',
          alignItems: 'center', textAlign: 'center', gap: 16,
        }}>
          <div style={{
            width: 48, height: 48, border: `1px solid ${t.line}`,
            display: 'flex', alignItems: 'center', justifyContent: 'center',
            marginBottom: 8,
          }}>
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke={t.muted} strokeWidth="1.4" strokeLinecap="round">
              <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
            </svg>
          </div>
          <p style={{ fontSize: 14, fontWeight: 600, color: t.ink, letterSpacing: '0.01em' }}>
            Pronto sumaremos nuevos proyectos en esta categoría.
          </p>
          <p style={{ fontSize: 13, fontWeight: 300, color: t.muted, maxWidth: 320, lineHeight: 1.7 }}>
            Mientras tanto podés escribirnos y contarnos qué estás buscando.
          </p>
          <div style={{
            marginTop: 8, fontSize: 10, fontWeight: 700, letterSpacing: '0.14em',
            textTransform: 'uppercase', color: t.ink2, cursor: 'pointer',
            borderBottom: `1px solid ${t.ink2}`, paddingBottom: 2,
          }}>
            ESCRIBIR POR WHATSAPP
          </div>
        </div>
      );
    }

    // ── PROYECTOS GRID ────────────────────────────────────────────────
    // Grilla de 6 cols fija: LG = span 3 (2 por fila), MD = span 2 (3 por fila)
    // En ejecución primero → quedan en su propia fila, terminados debajo
    function ProyectosGrid({ projects, filter }) {
      if (projects.length === 0) return <EmptyState />;

      const sorted = filter === 'todos'
        ? [...projects].sort((a, b) =>
            a.status === 'En Ejecución' && b.status !== 'En Ejecución' ? -1 : 1)
        : projects;

      return (
        <div style={{
          display: 'grid',
          gridTemplateColumns: 'repeat(6, 1fr)',
          gap: 16,
        }}>
          {sorted.map(p => (
            <ProjectCard
              key={p.id}
              project={p}
              size={getCardSize(p, filter)}
            />
          ))}
        </div>
      );
    }

    // ── CONTACT SECTION ───────────────────────────────────────────────
    function ContactSection() {
      const fieldStyle = {
        width: '100%', padding: '12px 14px',
        fontSize: 13, fontWeight: 400, color: t.ink,
        background: t.bg, border: `1px solid ${t.line2}`,
        borderRadius: 2, appearance: 'none',
      };
      const labelStyle = {
        display: 'block', fontSize: 9, fontWeight: 700,
        letterSpacing: '0.14em', textTransform: 'uppercase',
        color: t.muted, marginBottom: 8,
      };
      return (
        <section style={{ padding: '96px 56px', borderTop: `1px solid ${t.line}` }}>
          <div style={{ maxWidth: 640, margin: '0 auto' }}>
            <SectionLabel>Contacto</SectionLabel>
            <h2 style={{
              fontSize: 30, fontWeight: 700, letterSpacing: '0.01em',
              color: t.ink, lineHeight: 1.25, marginBottom: 48,
            }}>
              ¿No encontraste lo que buscás?
            </h2>

            <div style={{ display: 'flex', flexDirection: 'column', gap: 24 }}>
              {/* Nombre + Celular en fila */}
              <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 16 }}>
                <div>
                  <label style={labelStyle}>Nombre completo</label>
                  <input type="text" placeholder="Ej: María González" style={fieldStyle} readOnly />
                </div>
                <div>
                  <label style={labelStyle}>Celular</label>
                  <input type="text" placeholder="+54 11 ···· ····" style={fieldStyle} readOnly />
                </div>
              </div>

              {/* Email */}
              <div>
                <label style={labelStyle}>Email</label>
                <input type="email" placeholder="nombre@email.com" style={fieldStyle} readOnly />
              </div>

              {/* Proyecto de interés */}
              <div>
                <label style={labelStyle}>Proyecto de interés</label>
                <select style={{ ...fieldStyle, color: t.ink }} defaultValue="">
                  <option value="" disabled>Seleccioná un proyecto</option>
                  <option value="Cosquín 1534">Cosquín 1534</option>
                  <option value="Av. Larrazábal 1255">Av. Larrazábal 1255</option>
                  <option value="Zelada 6171">Zelada 6171</option>
                  <option value="otro">Otro / No sé aún</option>
                </select>
              </div>

              {/* Mensaje */}
              <div>
                <label style={labelStyle}>Mensaje</label>
                <textarea
                  placeholder="Contanos qué información necesitás..."
                  rows={4}
                  style={{ ...fieldStyle, resize: 'vertical' }}
                  readOnly
                />
              </div>

              {/* Submit */}
              <button style={{
                width: '100%', padding: '16px',
                fontSize: 11, fontWeight: 700, letterSpacing: '0.14em', textTransform: 'uppercase',
                background: t.ink, color: '#ffffff',
                border: 'none', cursor: 'pointer', borderRadius: 2,
                marginTop: 8,
              }}>
                ENVIAR CONSULTA
              </button>
            </div>
          </div>
        </section>
      );
    }

    // ── FOOTER ────────────────────────────────────────────────────────
    function Footer() {
      return (
        <footer style={{ background: t.ink, padding: '56px 56px 40px' }}>
          <div style={{
            display: 'grid', gridTemplateColumns: '1.4fr 1fr 1fr 1fr',
            gap: 48, marginBottom: 48,
          }}>
            <div>
              <div style={{ marginBottom: 20 }}>
                <Logo size={44} color="rgba(255,255,255,0.85)" />
              </div>
              <div style={{
                fontSize: 12, fontWeight: 300, lineHeight: 1.9,
                color: 'rgba(255,255,255,0.5)',
              }}>
                Guardia Nacional 739, PB<br />
                Ciudad de Buenos Aires
              </div>
            </div>
            <div>
              <div style={{
                fontSize: 9, fontWeight: 700, letterSpacing: '0.16em',
                textTransform: 'uppercase', color: 'rgba(255,255,255,0.35)', marginBottom: 20,
              }}>
                Proyectos
              </div>
              {['Cosquín 1534', 'Av. Larrazábal 1255', 'Zelada 6171'].map(p => (
                <div key={p} style={{
                  fontSize: 12, fontWeight: 400, color: 'rgba(255,255,255,0.6)',
                  marginBottom: 10, cursor: 'pointer',
                }}>
                  {p}
                </div>
              ))}
            </div>
            <div>
              <div style={{
                fontSize: 9, fontWeight: 700, letterSpacing: '0.16em',
                textTransform: 'uppercase', color: 'rgba(255,255,255,0.35)', marginBottom: 20,
              }}>
                Empresa
              </div>
              {['Inicio', 'Nosotros', 'Proyectos', 'Contacto'].map(l => (
                <div key={l} style={{
                  fontSize: 12, fontWeight: 400, color: 'rgba(255,255,255,0.6)',
                  marginBottom: 10, cursor: 'pointer',
                }}>
                  {l}
                </div>
              ))}
            </div>
            <div>
              <div style={{
                fontSize: 9, fontWeight: 700, letterSpacing: '0.16em',
                textTransform: 'uppercase', color: 'rgba(255,255,255,0.35)', marginBottom: 20,
              }}>
                Contacto
              </div>
              <div style={{
                fontSize: 12, fontWeight: 300, lineHeight: 2,
                color: 'rgba(255,255,255,0.6)', marginBottom: 16,
              }}>
                Rigmagrupo@gmail.com
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                  <path fillRule="evenodd" clipRule="evenodd" d="M12 2C6.477 2 2 6.477 2 12c0 1.89.526 3.657 1.44 5.163L2 22l4.98-1.418A9.954 9.954 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm-1.45 5.5c-.18-.45-.37-.46-.54-.47-.14-.01-.3-.01-.46-.01-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.67 2.66 4.1 3.63.57.22 1.02.35 1.37.45.57.18 1.1.15 1.51.09.46-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.92-1.18-.71-.63-1.19-1.41-1.33-1.65-.14-.24-.015-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78z" fill="rgba(255,255,255,0.5)"/>
                </svg>
                <span style={{ fontSize: 12, fontWeight: 400, color: 'rgba(255,255,255,0.6)' }}>
                  WhatsApp
                </span>
              </div>
            </div>
          </div>
          <div style={{
            paddingTop: 24, borderTop: '1px solid rgba(255,255,255,0.08)',
            fontSize: 10, fontWeight: 400, color: 'rgba(255,255,255,0.25)',
            letterSpacing: '0.06em',
          }}>
            © 2026 Rigma Group · Todos los derechos reservados
          </div>
        </footer>
      );
    }

    // ── APP ───────────────────────────────────────────────────────────
    function App() {
      const [filter, setFilter] = useState('todos');
      const visible = filterProjects(ALL_PROJECTS, filter);

      return (
        <div style={{ fontFamily: "'Montserrat', sans-serif", background: t.bg }}>
          <NavBar />
          <PageHeader />
          <FilterTabs active={filter} onChange={setFilter} />
          <section style={{ padding: '48px 56px 80px' }}>
            <ProyectosGrid projects={visible} filter={filter} />
          </section>
          <ContactSection />
          <Footer />
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);

    /*
    ── COMPONENTES NUEVOS GENERADOS EN ESTE WIREFRAME ─────────────────
    Para sumar a wireframes-system.md:

    FilterTabs
      Tabs horizontales de un solo eje. Props: active (string id), onChange (fn).
      Estado activo: underline 2px ink, peso 600, color ink.
      Estado inactivo: peso 500, color muted, sin underline.
      label-sm UPPERCASE, letterSpacing 0.12em, gap 40 entre tabs.
      Separador: borderBottom 1px line en el container, tab activo lo cubre con marginBottom -1.

    ProjectCard (size: 'lg' | 'md')
      Card unificado con prop size para manejar las dos variantes.
      LG: gridColumn '1 / -1' (span full row), height 400, overlay bottom-to-top intenso,
          título 48px 700, uppercase, "VER PROYECTO →" underline blanco.
      MD: gridColumn auto (1 col en 3-col grid), aspectRatio 4/5, overlay más corto,
          título 18px 600 (card-title), "VER PROYECTO →" underline blanco.
      Ambos: StatusPill dark, ubicación + año en label-xs UPPERCASE blanco muted.

    ProyectosGrid
      Grid CSS 3-col, gap 12. Pasa size a cada ProjectCard según getCardSize(project, filter).
      Renderiza EmptyState si el array filtrado es vacío.

    EmptyState
      Icono de búsqueda centrado (stroke SVG 20px, border cuadrado 48px).
      Cuerpo de texto body-sm + body-xs muted.
      CTA underline: "ESCRIBIR POR WHATSAPP".

    ContactSection (variante listado — NO es ContactCTA de la ficha)
      Layout horizontal: copy izquierda (max 480) + 2 CTAs derecha (columna).
