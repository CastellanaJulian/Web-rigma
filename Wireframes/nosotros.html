<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Nosotros — Wireframe · Rigma</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f0f0f0;
      -webkit-font-smoothing: antialiased;
    }
    #root { max-width: 1440px; margin: 0 auto; background: #ffffff; box-shadow: 0 0 60px rgba(0,0,0,0.12); }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">

    // ── DESIGN TOKENS ─────────────────────────────────────────────────
    const t = {
      bg:       '#ffffff',
      ink:      '#171717',
      ink2:     '#404040',
      muted:    '#737373',
      line:     '#e5e5e5',
      line2:    '#d4d4d4',
      surface:  '#fafafa',
      surface2: '#f5f5f5',
    };

    // ── SECTION LABEL ─────────────────────────────────────────────────
    function SectionLabel({ children, dark = false }) {
      const color = dark ? 'rgba(255,255,255,0.45)' : t.muted;
      return (
        <div style={{
          display: 'flex', alignItems: 'center', gap: 12,
          fontSize: 10, fontWeight: 600, letterSpacing: '0.2em',
          textTransform: 'uppercase', color,
          marginBottom: 36,
        }}>
          <span style={{ width: 20, height: 1, background: color, flexShrink: 0 }} />
          {children}
        </div>
      );
    }

    // ── LOGO ──────────────────────────────────────────────────────────
    function Logo({ size = 40, color = t.ink }) {
      const border   = Math.round(size * 0.055);
      const fontSize = Math.round(size * 0.4);
      const pad      = Math.round(size * 0.1);
      return (
        <div style={{
          width: size, height: size, flexShrink: 0,
          border: `${border}px solid ${color}`,
          display: 'flex', flexDirection: 'column', justifyContent: 'center',
          padding: `0 ${pad}px`, lineHeight: 1.05,
        }}>
          <div style={{ fontSize, fontWeight: 500, letterSpacing: '-0.01em', color, fontFamily: "'Montserrat', sans-serif" }}>RIG</div>
          <div style={{ fontSize, fontWeight: 500, letterSpacing: '-0.01em', color, fontFamily: "'Montserrat', sans-serif" }}>MA</div>
        </div>
      );
    }

    // ── NAVBAR ────────────────────────────────────────────────────────
    function NavBar() {
      return (
        <nav style={{
          position: 'sticky', top: 0, zIndex: 100,
          height: 64, background: 'rgba(255,255,255,0.96)',
          borderBottom: `1px solid ${t.line}`,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '0 56px',
        }}>
          <Logo size={40} color={t.ink} />
          <div style={{ display: 'flex', alignItems: 'center', gap: 40 }}>
            {['INICIO', 'PROYECTOS', 'NOSOTROS', 'CONTACTO'].map(link => (
              <span key={link} style={{
                fontSize: 10, fontWeight: 600, letterSpacing: '0.12em',
                textTransform: 'uppercase',
                color: link === 'NOSOTROS' ? t.ink : t.muted,
                cursor: 'pointer',
                borderBottom: link === 'NOSOTROS' ? `1.5px solid ${t.ink}` : '1.5px solid transparent',
                paddingBottom: 3,
              }}>
                {link}
              </span>
            ))}
          </div>
        </nav>
      );
    }

    // ── PLACEHOLDER ───────────────────────────────────────────────────
    function Placeholder({ label, style = {} }) {
      return (
        <div style={{
          background: `repeating-linear-gradient(135deg, ${t.surface2} 0 14px, ${t.line2} 14px 15px)`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          position: 'relative', overflow: 'hidden',
          ...style,
        }}>
          {label && (
            <span style={{
              fontSize: 10, fontWeight: 600, letterSpacing: '0.04em',
              color: t.muted,
              background: 'rgba(255,255,255,0.82)',
              padding: '5px 12px', borderRadius: 2,
            }}>
              {label}
            </span>
          )}
        </div>
      );
    }

    // ── 01 · PAGE HEADER ──────────────────────────────────────────────
    function PageHeader() {
      return (
        <section style={{ padding: '80px 56px 64px' }}>
          <SectionLabel>Nosotros</SectionLabel>
          <h1 style={{
            fontSize: 56, fontWeight: 700, lineHeight: 1.05,
            letterSpacing: '-0.025em', color: t.ink,
            maxWidth: 680, marginBottom: 24,
          }}>
            Tres generaciones.<br />
            Una forma de construir.
          </h1>
          <p style={{
            fontSize: 16, fontWeight: 300, lineHeight: 1.7,
            color: t.ink2, maxWidth: 540,
          }}>
            Empresa constructora familiar fundada en 2016, con trayectoria de tres generaciones en el rubro. Responsabilidad, compromiso y mejora continua en cada proyecto.
          </p>
        </section>
      );
    }

    // ── 02 · HISTORIA + MÉTRICAS ──────────────────────────────────────
    function HistoriaSection() {
      return (
        <section style={{ padding: '48px 56px 120px', borderBottom: `1px solid ${t.line}` }}>
          <SectionLabel>Historia</SectionLabel>

          {/* Imagen a lo ancho */}
          <Placeholder
            label="foto · equipo / obra / empresa"
            style={{ width: '100%', aspectRatio: '16/6', marginBottom: 64 }}
          />

          {/* 2 columnas: texto condensado + métricas */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 1fr', gap: 80, alignItems: 'start' }}>

            {/* Columna izquierda: historia breve */}
            <div>
              <p style={{ fontSize: 16, fontWeight: 400, lineHeight: 1.75, color: t.ink2, marginBottom: 24 }}>
                Somos una empresa constructora familiar con trayectoria de tres generaciones. Consolidamos una forma de trabajo basada en la responsabilidad, el compromiso y la mejora continua, combinando tradición constructiva con una mirada adaptada a las nuevas necesidades del mercado.
              </p>
              <p style={{ fontSize: 16, fontWeight: 400, lineHeight: 1.75, color: t.ink2 }}>
                Nos especializamos en espacios multifuncionales que optimizan uso, flexibilidad y confort. Entendemos cada proyecto como único y trabajamos en cercanía con el cliente para lograr resultados que combinen funcionalidad, estética y durabilidad.
              </p>
            </div>

            {/* Columna derecha: métricas */}
            <div>
              <div style={{ paddingBottom: 48, borderBottom: `1px solid ${t.line}` }}>
                <div style={{ fontSize: 56, fontWeight: 700, lineHeight: 1, letterSpacing: '-0.02em', color: t.ink, marginBottom: 12 }}>
                  +32.000
                </div>
                <div style={{ fontSize: 11, fontWeight: 500, letterSpacing: '0.10em', textTransform: 'uppercase', color: t.muted }}>
                  M² construidos
                </div>
              </div>
              <div style={{ paddingTop: 48 }}>
                <div style={{ fontSize: 56, fontWeight: 700, lineHeight: 1, letterSpacing: '-0.02em', color: t.ink, marginBottom: 12 }}>
                  +220
                </div>
                <div style={{ fontSize: 11, fontWeight: 500, letterSpacing: '0.10em', textTransform: 'uppercase', color: t.muted }}>
                  Unidades funcionales
                </div>
              </div>
            </div>

          </div>
        </section>
      );
    }

    // ── 04 · EQUIPO ───────────────────────────────────────────────────
    function EquipoSection() {
      const members = [
        { role: 'Dirección ejecutiva' },
        { role: 'Dirección de obra' },
        { role: 'Administración' },
        { role: 'Atención al cliente' },
      ];
      return (
        <section style={{ padding: '120px 56px', borderBottom: `1px solid ${t.line}` }}>
          <SectionLabel>Equipo</SectionLabel>
          <div style={{
            display: 'grid',
            gridTemplateColumns: 'repeat(4, 1fr)',
            gap: 32,
          }}>
            {members.map((m, i) => (
              <div key={i}>
                <Placeholder
                  label="foto · integrante equipo"
                  style={{ aspectRatio: '3/4', marginBottom: 20 }}
                />
                <div style={{
                  fontSize: 15, fontWeight: 600, color: t.ink,
                  marginBottom: 6, lineHeight: 1.2,
                }}>
                  Nombre Apellido
                </div>
                <div style={{
                  fontSize: 11, fontWeight: 500, letterSpacing: '0.10em',
                  textTransform: 'uppercase', color: t.muted,
                }}>
                  {m.role}
                </div>
              </div>
            ))}
          </div>
        </section>
      );
    }

    // ── 05 · FILOSOFÍA (dark, imagen izquierda + 3 pilares derecha) ───
    function PilaresSection() {
      const pillars = [
        {
          title: 'Calidad en cada etapa',
          desc: 'Cuidamos los detalles constructivos desde el diseño hasta la ejecución. La calidad no es un resultado: es el proceso que lo garantiza.',
        },
        {
          title: 'Compromiso con el cliente',
          desc: 'Trabajamos en cercanía con quienes confían en nosotros. Entendemos cada proyecto como único y lo tratamos como tal.',
        },
        {
          title: 'Espacios que agregan valor',
          desc: 'Desarrollamos espacios multifuncionales pensados para optimizar el uso, la flexibilidad y el confort de cada habitante.',
        },
      ];
      return (
        <section style={{ background: t.ink, padding: '120px 56px' }}>
          <SectionLabel dark>Filosofía de trabajo</SectionLabel>
          <div style={{
            display: 'grid',
            gridTemplateColumns: '1fr 1fr',
            gap: 80,
            alignItems: 'stretch',
          }}>

            {/* Columna izquierda — imagen */}
            <Placeholder
              label="foto · equipo / obra / empresa"
              style={{
                width: '100%', height: '100%', minHeight: 400,
                background: `repeating-linear-gradient(135deg, #1f1f1f 0 14px, rgba(255,255,255,0.06) 14px 15px)`,
              }}
            />

            {/* Columna derecha — 3 pilares apilados */}
            <div style={{ display: 'flex', flexDirection: 'column', justifyContent: 'center' }}>
              {pillars.map((p, i) => (
                <div key={i} style={{
                  paddingTop: i === 0 ? 0 : 36,
                  paddingBottom: 36,
                  borderBottom: i < pillars.length - 1 ? '1px solid rgba(255,255,255,0.12)' : 'none',
                }}>
                  <div style={{
                    fontSize: 20, fontWeight: 600, color: '#ffffff',
                    lineHeight: 1.2, letterSpacing: '-0.01em', marginBottom: 10,
                  }}>
                    {p.title}
                  </div>
                  <div style={{
                    fontSize: 14, fontWeight: 400, lineHeight: 1.7,
                    color: 'rgba(255,255,255,0.65)',
                  }}>
                    {p.desc}
                  </div>
                </div>
              ))}
            </div>

          </div>
        </section>
      );
    }

    // ── 06 · REDIRECCIÓN ──────────────────────────────────────────────
    function RedireccionSection() {
      return (
        <section style={{ padding: '120px 56px', borderBottom: `1px solid ${t.line}` }}>
          <div style={{ maxWidth: 680 }}>
            <SectionLabel>Más sobre nosotros</SectionLabel>
            <h2 style={{
              fontSize: 48, fontWeight: 700, lineHeight: 1.05,
              letterSpacing: '-0.02em', color: t.ink, marginBottom: 20,
            }}>
              Conocé nuestros proyectos o escribinos directamente.
            </h2>
            <p style={{
              fontSize: 15, fontWeight: 300, lineHeight: 1.75,
              color: t.ink2, marginBottom: 40,
            }}>
              Cada obra tiene su historia. Visitá el portfolio para ver disponibilidad y detalle de cada proyecto, o escribinos para consultas personalizadas.
            </p>
            <div style={{ display: 'flex', gap: 24, alignItems: 'center' }}>
              <button style={{
                padding: '14px 28px',
                fontSize: 11, fontWeight: 700, letterSpacing: '0.12em',
                textTransform: 'uppercase',
                background: t.ink, color: '#ffffff',
                border: 'none', cursor: 'pointer', borderRadius: 2,
                fontFamily: "'Montserrat', sans-serif",
              }}>
                VER PROYECTOS →
              </button>
              <span style={{
                fontSize: 13, fontWeight: 500, color: t.ink,
                borderBottom: `1px solid ${t.ink}`, paddingBottom: 2,
                cursor: 'pointer', letterSpacing: '0.04em',
              }}>
                Contactarnos →
              </span>
            </div>
          </div>
        </section>
      );
    }

    // ── FOOTER ────────────────────────────────────────────────────────
    function Footer() {
      return (
        <footer style={{ background: t.ink, padding: '56px 56px 40px' }}>
          <div style={{
            display: 'grid', gridTemplateColumns: '1.4fr 1fr 1fr 1fr',
            gap: 48, marginBottom: 48,
          }}>
            <div>
              <div style={{ marginBottom: 20 }}>
                <Logo size={44} color="rgba(255,255,255,0.85)" />
              </div>
              <div style={{
                fontSize: 12, fontWeight: 300, lineHeight: 1.9,
                color: 'rgba(255,255,255,0.5)',
              }}>
                Guardia Nacional 739, PB<br />
                Ciudad de Buenos Aires
              </div>
            </div>
            <div>
              <div style={{
                fontSize: 9, fontWeight: 700, letterSpacing: '0.16em',
                textTransform: 'uppercase', color: 'rgba(255,255,255,0.35)', marginBottom: 20,
              }}>
                Proyectos
              </div>
              {['Cosquín 1534', 'Av. Larrazábal 1255', 'Zelada 6171'].map(p => (
                <div key={p} style={{
                  fontSize: 12, fontWeight: 400, color: 'rgba(255,255,255,0.6)',
                  marginBottom: 10, cursor: 'pointer',
                }}>
                  {p}
                </div>
              ))}
            </div>
            <div>
              <div style={{
                fontSize: 9, fontWeight: 700, letterSpacing: '0.16em',
                textTransform: 'uppercase', color: 'rgba(255,255,255,0.35)', marginBottom: 20,
              }}>
                Empresa
              </div>
              {['Inicio', 'Nosotros', 'Proyectos', 'Contacto'].map(l => (
                <div key={l} style={{
                  fontSize: 12, fontWeight: 400, color: 'rgba(255,255,255,0.6)',
                  marginBottom: 10, cursor: 'pointer',
                }}>
                  {l}
                </div>
              ))}
            </div>
            <div>
              <div style={{
                fontSize: 9, fontWeight: 700, letterSpacing: '0.16em',
                textTransform: 'uppercase', color: 'rgba(255,255,255,0.35)', marginBottom: 20,
              }}>
                Contacto
              </div>
              <div style={{
                fontSize: 12, fontWeight: 300, lineHeight: 2,
                color: 'rgba(255,255,255,0.6)', marginBottom: 16,
              }}>
                Rigmagrupo@gmail.com
              </div>
              <div style={{ display: 'flex', alignItems: 'center', gap: 10, cursor: 'pointer' }}>
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none">
                  <path fillRule="evenodd" clipRule="evenodd"
                    d="M12 2C6.477 2 2 6.477 2 12c0 1.89.526 3.657 1.44 5.163L2 22l4.98-1.418A9.954 9.954 0 0012 22c5.523 0 10-4.477 10-10S17.523 2 12 2zm-1.45 5.5c-.18-.45-.37-.46-.54-.47-.14-.01-.3-.01-.46-.01-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.67 2.66 4.1 3.63.57.22 1.02.35 1.37.45.57.18 1.1.15 1.51.09.46-.07 1.42-.58 1.62-1.14.2-.56.2-1.04.14-1.14-.06-.1-.22-.16-.46-.28-.24-.12-1.42-.7-1.64-.78-.22-.08-.38-.12-.54.12-.16.24-.62.78-.76.94-.14.16-.28.18-.52.06-.24-.12-1.01-.37-1.92-1.18-.71-.63-1.19-1.41-1.33-1.65-.14-.24-.015-.37.1-.49.11-.11.24-.28.36-.42.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.54-1.3-.74-1.78z"
                    fill="rgba(255,255,255,0.5)"
                  />
                </svg>
                <span style={{ fontSize: 12, fontWeight: 400, color: 'rgba(255,255,255,0.6)' }}>
                  WhatsApp
                </span>
              </div>
            </div>
          </div>
          <div style={{
            paddingTop: 24, borderTop: '1px solid rgba(255,255,255,0.08)',
            fontSize: 10, fontWeight: 400, color: 'rgba(255,255,255,0.25)',
            letterSpacing: '0.06em',
          }}>
            © 2026 Rigma Group · Todos los derechos reservados
          </div>
        </footer>
      );
    }

    // ── APP ───────────────────────────────────────────────────────────
    function App() {
      return (
        <div style={{ fontFamily: "'Montserrat', sans-serif", background: t.bg }}>
          <NavBar />
          <PageHeader />
          <HistoriaSection />
          <EquipoSection />
          <PilaresSection />
          <RedireccionSection />
          <Footer />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);

    /*
    ── DECISIONES DE ESTE WIREFRAME ───────────────────────────────────
    Sesión: 12/5/2026.

    Estructura (fuente: sitemap/Rigma-group-sitemap.csv):
      NavBar (NOSOTROS activo)
      → PageHeader tipográfico (sin borderBottom — fluye directo a Historia)
      → Historia + Métricas (texto columna única + 2 stats al pie)
      → Equipo en grilla de 4 cards
      → Filosofía — Variante B oscuro, 2 cols numeradas
      → Redirección — CTA claro doble (Proyectos + Contacto)
      → Footer

    SectionLabels: sin numeración — alineado a proyectos.html e inicio.html
      donde el label es solo el nombre ("Proyectos", "Nosotros", etc.).

    PageHeader:
      - Sin borderBottom — la sección Historia que sigue tiene su propio borderBottom,
        no necesitaba un separador extra entre ellas.
      - H1 56px "Tres generaciones. / Una forma de construir." + subtítulo 300.

    Historia + Métricas (bloque fusionado):
      - Copy completo del cliente en columna única maxWidth 760.
      - Sin imagen lateral (simplifica el bloque, el peso visual lo llevan las métricas).
      - Sin CTA "Ver proyectos" (el scroll natural lleva al usuario a las secciones restantes).
      - 2 métricas al pie separadas por borderTop: +32.000 M² CONSTRUIDOS · +220 UNIDADES FUNCIONALES.
        Elegidas por ser las más concretas en escala de producción. Las otras 2 (+3 generaciones,
        2016) están presentes en el H1 y el subtítulo del PageHeader.

    Equipo — 4 cards, grilla 4 cols:
      - Fotos 3/4 portrait placeholder "foto · integrante equipo".
      - Nombre y rol con texto genérico — pendiente confirmar con cliente
        quiénes son y si tienen fotos disponibles (ver CLAUDE.md → Pendientes críticos).

    Filosofía — Variante B (dark, 2 cols numeradas):
      - Fondo ink, 4 pilares en grid 2 cols, gap 64.
      - Cada pilar: número grande (64px, rgba(255,255,255,0.18)) + título 22px 600
        + descripción 14px rgba(255,255,255,0.65).
      - Decisión: Variante B para diferenciar de Home (que usa Variante A claro).

    Redirección — doble CTA claro:
      - H2 48px + subtítulo + botón primario "VER PROYECTOS →" + link inline "Contactarnos →".
      - Fondo bg — evita dos secciones oscuras consecutivas (Pilares + Footer).
    */
  </script>
</body>
</html>
