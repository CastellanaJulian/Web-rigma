<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ficha de Proyecto — Wireframe · Rigma</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet" />
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: 'Montserrat', sans-serif;
      background: #f0f0f0;
      -webkit-font-smoothing: antialiased;
    }
    #root { max-width: 1440px; margin: 0 auto; background: #ffffff; box-shadow: 0 0 60px rgba(0,0,0,0.12); }
    input, textarea, select {
      font-family: 'Montserrat', sans-serif;
      outline: none;
    }
    input:focus, textarea:focus, select:focus {
      border-color: #404040 !important;
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    // ── DESIGN TOKENS ───────────────────────────────────────────────
    const t = {
      bg:       '#ffffff',
      ink:      '#171717',
      ink2:     '#404040',
      muted:    '#737373',
      line:     '#e5e5e5',
      line2:    '#d4d4d4',
      surface:  '#fafafa',
      surface2: '#f5f5f5',
    };

    // ── PLACEHOLDER (striped) ────────────────────────────────────────
    function Placeholder({ label, style = {} }) {
      return (
        <div style={{
          background: `repeating-linear-gradient(135deg, ${t.surface2} 0 14px, ${t.line2} 14px 15px)`,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          position: 'relative', overflow: 'hidden',
          ...style,
        }}>
          {label && (
            <span style={{
              fontFamily: "'Montserrat', sans-serif",
              fontSize: 10, fontWeight: 600,
              letterSpacing: '0.04em',
              color: t.muted,
              background: 'rgba(255,255,255,0.82)',
              padding: '5px 12px', borderRadius: 2,
              textAlign: 'center', maxWidth: '80%',
            }}>
              {label}
            </span>
          )}
        </div>
      );
    }

    // ── SECTION LABEL ────────────────────────────────────────────────
    function SectionLabel({ children }) {
      return (
        <div style={{
          display: 'flex', alignItems: 'center', gap: 12,
          fontSize: 10, fontWeight: 600, letterSpacing: '0.2em',
          textTransform: 'uppercase', color: t.muted,
          marginBottom: 36,
        }}>
          <span style={{ width: 20, height: 1, background: t.muted, flexShrink: 0 }} />
          {children}
        </div>
      );
    }

    // ── STATUS PILL ──────────────────────────────────────────────────
    function StatusPill({ status, dark = false }) {
      return (
        <span style={{
          display: 'inline-flex', alignItems: 'center', gap: 7,
          fontSize: 10, fontWeight: 600, letterSpacing: '0.12em', textTransform: 'uppercase',
          padding: '5px 12px',
          border: dark ? '1px solid rgba(255,255,255,0.35)' : `1px solid ${t.line2}`,
          background: dark ? 'rgba(255,255,255,0.12)' : t.surface,
          color: dark ? '#ffffff' : t.ink2,
          borderRadius: 2,
        }}>
          <span style={{
            width: 6, height: 6, borderRadius: '50%',
            background: dark ? 'rgba(255,255,255,0.75)' : t.muted,
            flexShrink: 0,
          }} />
          {status}
        </span>
      );
    }

    // ── ICON (wireframe placeholder) ─────────────────────────────────
    function Icon({ type }) {
      const icons = {
        quality: (
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={t.ink2} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
            <path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/>
          </svg>
        ),
        comfort: (
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={t.ink2} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
            <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
            <polyline points="9 22 9 12 15 12 15 22"/>
          </svg>
        ),
        security: (
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={t.ink2} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
            <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
          </svg>
        ),
        location: (
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={t.ink2} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
            <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0118 0z"/>
            <circle cx="12" cy="10" r="3"/>
          </svg>
        ),
        transport: (
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={t.ink2} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
            <rect x="2" y="7" width="20" height="14" rx="2"/>
            <path d="M16 21V5a2 2 0 00-2-2h-4a2 2 0 00-2 2v16"/>
            <line x1="2" y1="12" x2="22" y2="12"/>
          </svg>
        ),
        health: (
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={t.ink2} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
            <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
          </svg>
        ),
        education: (
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={t.ink2} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
            <path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z"/>
            <path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z"/>
          </svg>
        ),
        commerce: (
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke={t.ink2} strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round">
            <path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/>
            <line x1="3" y1="6" x2="21" y2="6"/>
            <path d="M16 10a4 4 0 01-8 0"/>
          </svg>
        ),
      };
      return icons[type] || null;
    }

    // ── LOGO ─────────────────────────────────────────────────────────
    // Cuadrado con borde + "RIG / MA" en dos líneas, left-aligned
    function Logo({ size = 40, color = t.ink }) {
      const border = Math.round(size * 0.055);
      const fontSize = Math.round(size * 0.4);
      const pad = Math.round(size * 0.1);
      return (
        <div style={{
          width: size, height: size, flexShrink: 0,
          border: `${border}px solid ${color}`,
          display: 'flex', flexDirection: 'column', justifyContent: 'center',
          padding: `0 ${pad}px`,
          lineHeight: 1.05,
        }}>
          <div style={{ fontSize, fontWeight: 500, letterSpacing: '-0.01em', color, fontFamily: "'Montserrat', sans-serif" }}>RIG</div>
          <div style={{ fontSize, fontWeight: 500, letterSpacing: '-0.01em', color, fontFamily: "'Montserrat', sans-serif" }}>MA</div>
        </div>
      );
    }

    // ── NAVBAR ───────────────────────────────────────────────────────
    function NavBar() {
      return (
        <nav style={{
          position: 'sticky', top: 0, zIndex: 100,
          height: 64, background: 'rgba(255,255,255,0.96)',
          borderBottom: `1px solid ${t.line}`,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '0 56px',
        }}>
          <Logo size={40} color={t.ink} />
          <div style={{ display: 'flex', alignItems: 'center', gap: 40 }}>
            {['INICIO', 'PROYECTOS', 'NOSOTROS', 'CONTACTO'].map(link => (
              <span key={link} style={{
                fontSize: 10, fontWeight: 600, letterSpacing: '0.12em',
                textTransform: 'uppercase',
                color: link === 'PROYECTOS' ? t.ink : t.muted,
                cursor: 'pointer',
                borderBottom: link === 'PROYECTOS' ? `1.5px solid ${t.ink}` : '1.5px solid transparent',
                paddingBottom: 3,
              }}>
                {link}
              </span>
            ))}
          </div>
        </nav>
      );
    }

    // ── HERO ─────────────────────────────────────────────────────────
    function Hero() {
      return (
        <section style={{ position: 'relative', height: '86vh', minHeight: 580 }}>
          <Placeholder
            label="render · cosquín 1534"
            style={{ position: 'absolute', inset: 0 }}
          />
          <div style={{
            position: 'absolute', inset: 0,
            background: 'linear-gradient(to top, rgba(23,23,23,0.72) 0%, rgba(23,23,23,0.18) 55%, transparent 100%)',
          }} />
          <div style={{
            position: 'absolute', top: 28, left: 56,
            fontSize: 10, fontWeight: 500, letterSpacing: '0.1em', textTransform: 'uppercase',
            color: 'rgba(255,255,255,0.55)',
          }}>
            PROYECTOS / COSQUÍN 1534
          </div>
          <div style={{
            position: 'absolute', bottom: 0, left: 0, right: 0,
            padding: '0 56px 52px',
          }}>
            <StatusPill status="EN EJECUCIÓN" dark />
            <h1 style={{
              marginTop: 16, marginBottom: 10,
              fontSize: 56, fontWeight: 700, letterSpacing: '0.01em',
              textTransform: 'uppercase', color: '#ffffff', lineHeight: 1,
            }}>
              Cosquín 1534
            </h1>
            <p style={{
              fontSize: 13, fontWeight: 400, letterSpacing: '0.08em',
              textTransform: 'uppercase', color: 'rgba(255,255,255,0.65)',
              marginBottom: 24,
            }}>
              Mataderos, Ciudad de Buenos Aires
            </p>
            <a href="#contacto" style={{
              display: 'inline-block',
              fontSize: 10, fontWeight: 700, letterSpacing: '0.14em',
              textTransform: 'uppercase', color: t.ink,
              background: '#ffffff', padding: '10px 20px',
              borderRadius: 2, textDecoration: 'none', cursor: 'pointer',
            }}>
              CONTACTANOS →
            </a>
          </div>
        </section>
      );
    }

    // ── KEY DATA STRIP (sin Estado — se repite con el hero) ──────────
    function KeyDataStrip() {
      const data = [
        { label: 'Ubicación',            value: 'Mataderos, CABA' },
        { label: 'Entrega estimada',     value: 'Diciembre 2026' },
        { label: 'Unidades disponibles', value: '4 de 8' },
        { label: 'Avance de obra',       value: '60%' },
      ];
      return (
        <div style={{
          display: 'flex',
          borderTop: `1px solid ${t.line}`,
          borderBottom: `1px solid ${t.line}`,
          background: t.bg,
        }}>
          {data.map((d, i) => (
            <div key={i} style={{
              flex: 1, padding: '26px 32px',
              borderLeft: i > 0 ? `1px solid ${t.line}` : 'none',
            }}>
              <div style={{
                fontSize: 9, fontWeight: 600, letterSpacing: '0.14em',
                textTransform: 'uppercase', color: t.muted, marginBottom: 8,
              }}>
                {d.label}
              </div>
              <div style={{ fontSize: 15, fontWeight: 600, color: t.ink }}>
                {d.value}
              </div>
            </div>
          ))}
        </div>
      );
    }

    // ── DESCRIPCIÓN ──────────────────────────────────────────────────
    function DescriptionSection() {
      const datosCard = [
        { label: 'Inicio de obra',  value: 'Julio 2025' },
        { label: 'M² construibles', value: '1.800 m²' },
        { label: 'Total unidades',  value: '8 departamentos' },
        { label: 'Tipologías',      value: '4 ambientes' },
      ];
      const highlights = [
        {
          icon: 'quality',
          titulo: 'Terminaciones premium',
          texto: 'Porcelanato importado, mesadas de mármol y grifería Peirano línea Wave en cada unidad.',
        },
        {
          icon: 'comfort',
          titulo: 'Confort integral',
          texto: 'Piso radiante, caldera dual individual, cocina integrada y lavadero propio.',
        },
        {
          icon: 'security',
          titulo: 'Seguridad total',
          texto: 'Cámaras de seguridad, cerco eléctrico, portero eléctrico y acceso controlado.',
        },
      ];
      return (
        <section style={{ padding: '80px 56px' }}>
          {/* Texto + card datos */}
          <div style={{ display: 'grid', gridTemplateColumns: '1fr 300px', gap: 72, marginBottom: 64 }}>
            <div>
              <SectionLabel>Descripción</SectionLabel>
              <p style={{ fontSize: 15, fontWeight: 300, lineHeight: 1.8, color: t.ink2, marginBottom: 20 }}>
                Cosquín 1534 es un edificio residencial de ocho departamentos de cuatro ambientes ubicado en el corazón de Mataderos. Diseñado con foco en la funcionalidad y el confort, cada unidad incorpora materiales de primera calidad y terminaciones que marcan la diferencia.
              </p>
              <p style={{ fontSize: 15, fontWeight: 300, lineHeight: 1.8, color: t.ink2, marginBottom: 20 }}>
                El proyecto contempla cocinas abiertas integradas al living-comedor, dormitorios con placar embutido y baños completos. Terrazas verdes y cocheras disponibles como unidades complementarias.
              </p>
              <p style={{ fontSize: 15, fontWeight: 300, lineHeight: 1.8, color: t.ink2 }}>
                Financiación a consultar. Inicio de obra julio 2025, con entrega proyectada para diciembre 2026.
              </p>
            </div>
            <div>
              <div style={{
                background: t.surface, border: `1px solid ${t.line}`,
                padding: '28px 28px 20px',
              }}>
                <div style={{
                  fontSize: 9, fontWeight: 700, letterSpacing: '0.18em',
                  textTransform: 'uppercase', color: t.muted, marginBottom: 24,
                }}>
                  Datos del proyecto
                </div>
                {datosCard.map((h, i) => (
                  <div key={i} style={{
                    paddingBottom: 14, marginBottom: 14,
                    borderBottom: i < datosCard.length - 1 ? `1px solid ${t.line}` : 'none',
                  }}>
                    <div style={{
                      fontSize: 9, fontWeight: 600, letterSpacing: '0.12em',
                      textTransform: 'uppercase', color: t.muted, marginBottom: 4,
                    }}>
                      {h.label}
                    </div>
                    <div style={{ fontSize: 14, fontWeight: 600, color: t.ink }}>
                      {h.value}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          </div>

          {/* 3 highlights en cards */}
          <div style={{
            display: 'grid', gridTemplateColumns: '1fr 1fr 1fr',
            gap: 16, paddingTop: 48, borderTop: `1px solid ${t.line}`,
          }}>
            {highlights.map((h, i) => (
              <div key={i} style={{
                padding: '36px 32px',
                background: t.surface, border: `1px solid ${t.line}`,
              }}>
                <div style={{ marginBottom: 20 }}>
                  <Icon type={h.icon} />
                </div>
                <div style={{
                  fontSize: 13, fontWeight: 700, letterSpacing: '0.02em',
                  color: t.ink, marginBottom: 10,
                }}>
                  {h.titulo}
                </div>
                <div style={{ fontSize: 13, fontWeight: 300, lineHeight: 1.7, color: t.ink2 }}>
                  {h.texto}
                </div>
              </div>
            ))}
          </div>
        </section>
      );
    }

    // ── GALERÍA ASIMÉTRICA ────────────────────────────────────────────
    function GaleriaAsimetrica() {
      const thumbs = [
        'render · fachada lateral',
        'render · living / comedor',
        'render · cocina integrada',
        'render · dormitorio principal',
      ];
      return (
        <section style={{ background: t.surface, padding: '80px 0' }}>
          <div style={{ padding: '0 56px', marginBottom: 28 }}>
            <SectionLabel>Galería</SectionLabel>
          </div>
          <div style={{ padding: '0 56px' }}>
            <div style={{
              display: 'grid',
              gridTemplateColumns: '1fr 1fr',
              gridTemplateRows: '340px 200px',
              gap: 8,
            }}>
              <Placeholder
                label="render · fachada principal"
                style={{ gridRow: 'span 2', borderRadius: 2 }}
              />
              {thumbs.slice(0, 2).map((label, i) => (
                <Placeholder key={i} label={label} style={{ borderRadius: 2 }} />
              ))}
            </div>
            <div style={{
              display: 'grid',
              gridTemplateColumns: '1fr 1fr 1fr',
              gap: 8, marginTop: 8,
            }}>
              {thumbs.slice(2).map((label, i) => (
                <Placeholder key={i} label={label} style={{ height: 188, borderRadius: 2 }} />
              ))}
              <div style={{
                height: 188, display: 'flex', alignItems: 'center', justifyContent: 'center',
                border: `1px dashed ${t.line2}`, borderRadius: 2, cursor: 'pointer',
                flexDirection: 'column', gap: 8,
              }}>
                <span style={{ fontSize: 22, color: t.line2, fontWeight: 300 }}>+</span>
                <span style={{
                  fontSize: 10, fontWeight: 600, letterSpacing: '0.1em',
                  textTransform: 'uppercase', color: t.muted,
                }}>
                  Ver galería completa
                </span>
              </div>
            </div>
          </div>
        </section>
      );
    }

    // ── PLANOS (acordeón por tipología) ──────────────────────────────
    function PlanosList() {
      const [openGroup, setOpenGroup] = useState('mono');
      const [modal, setModal] = useState(null);

      const grupos = [
        {
          id: 'mono',
          titulo: 'Monoambiente',
          sublabel: '3 unidades · desde 38 m²',
          planos: [
            { id: 'm-1', label: 'Monoambiente A', sublabel: '38 m²' },
            { id: 'm-2', label: 'Monoambiente B', sublabel: '41 m² · con balcón' },
            { id: 'm-3', label: 'Monoambiente C', sublabel: '40 m²' },
          ],
        },
        {
          id: '2amb',
          titulo: '2 ambientes',
          sublabel: '4 unidades · desde 58 m²',
          planos: [
            { id: '2a-1', label: '2 amb. A', sublabel: '58 m²' },
            { id: '2a-2', label: '2 amb. B', sublabel: '62 m² · con balcón' },
          ],
        },
        {
          id: '3amb',
          titulo: '3 ambientes',
          sublabel: '2 unidades · desde 78 m²',
          planos: [
            { id: '3a-1', label: '3 amb. A', sublabel: '78 m²' },
            { id: '3a-2', label: '3 amb. B', sublabel: '85 m² · esquina' },
          ],
        },
      ];

      return (
        <section style={{ padding: '80px 56px', borderTop: `1px solid ${t.line}` }}>
          <SectionLabel>Planos</SectionLabel>

          <div style={{ display: 'flex', flexDirection: 'column' }}>
            {grupos.map((g, gi) => {
              const isOpen = openGroup === g.id;
              return (
                <div key={g.id} style={{ borderTop: gi === 0 ? `1px solid ${t.line}` : 'none' }}>
                  {/* Cabecera acordeón */}
                  <div
                    onClick={() => setOpenGroup(isOpen ? null : g.id)}
                    style={{
                      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
                      padding: '22px 0', borderBottom: `1px solid ${t.line}`,
                      cursor: 'pointer',
                    }}
                  >
                    <div style={{ display: 'flex', alignItems: 'baseline', gap: 14 }}>
                      <span style={{ fontSize: 14, fontWeight: 600, color: t.ink }}>{g.titulo}</span>
                      <span style={{ fontSize: 12, fontWeight: 400, color: t.muted }}>{g.sublabel}</span>
                    </div>
                    {/* Chevron */}
                    <svg
                      width="16" height="16" viewBox="0 0 16 16" fill="none"
                      style={{ transition: 'transform 0.2s', transform: isOpen ? 'rotate(180deg)' : 'rotate(0deg)', flexShrink: 0 }}
                    >
                      <path d="M3 6l5 5 5-5" stroke={t.muted} strokeWidth="1.5" strokeLinecap="round" strokeLinejoin="round"/>
                    </svg>
                  </div>

                  {/* Contenido desplegable */}
                  {isOpen && (
                    <div style={{ display: 'flex', gap: 16, padding: '28px 0 32px' }}>
                      {g.planos.map(p => (
                        <div
                          key={p.id}
                          onClick={() => setModal(p)}
                          style={{ width: 180, cursor: 'zoom-in' }}
                        >
                          <Placeholder
                            label="plano"
                            style={{
                              height: 128, borderRadius: 2, marginBottom: 10,
                              border: `1px solid ${t.line}`,
                            }}
                          />
                          <div style={{ fontSize: 12, fontWeight: 600, color: t.ink, marginBottom: 2 }}>{p.label}</div>
                          <div style={{ fontSize: 11, fontWeight: 400, color: t.muted }}>{p.sublabel}</div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>
              );
            })}
          </div>

          {/* Modal */}
          {modal && (
            <div
              onClick={() => setModal(null)}
              style={{
                position: 'fixed', inset: 0, zIndex: 300,
                background: 'rgba(23,23,23,0.78)',
                display: 'flex', alignItems: 'center', justifyContent: 'center',
              }}
            >
              <div
                onClick={e => e.stopPropagation()}
                style={{ background: t.bg, padding: 48, maxWidth: 680, width: '90%', position: 'relative' }}
              >
                {/* X — cierre en esquina superior derecha */}
                <button
                  onClick={() => setModal(null)}
                  style={{
                    position: 'absolute', top: 16, right: 16,
                    width: 32, height: 32, display: 'flex', alignItems: 'center', justifyContent: 'center',
                    background: 'none', border: `1px solid ${t.line}`, cursor: 'pointer',
                    fontSize: 16, color: t.muted, lineHeight: 1,
                  }}
                >
                  ×
                </button>

                <div style={{
                  fontSize: 9, fontWeight: 700, letterSpacing: '0.18em',
                  textTransform: 'uppercase', color: t.muted, marginBottom: 20,
                }}>
                  PLANO DETALLADO
                </div>
                <Placeholder
                  label={`plano · ${modal.label.toLowerCase()}`}
                  style={{ height: 420, borderRadius: 2, marginBottom: 24 }}
                />
                <div style={{ display: 'flex', justifyContent: 'space-between', alignItems: 'flex-end' }}>
                  <div>
                    <div style={{ fontSize: 15, fontWeight: 700, color: t.ink, marginBottom: 4 }}>{modal.label}</div>
                    <div style={{ fontSize: 12, color: t.muted }}>{modal.sublabel}</div>
                  </div>
                  <button style={{
                    fontSize: 10, fontWeight: 600, letterSpacing: '0.1em', textTransform: 'uppercase',
                    color: t.muted, background: 'none',
                    border: `1px solid ${t.line}`, cursor: 'pointer', padding: '8px 16px',
                  }}>
                    DESCARGAR PDF
                  </button>
                </div>
              </div>
            </div>
          )}
        </section>
      );
    }

    // ── UBICACIÓN ────────────────────────────────────────────────────
    function LocationBlock() {
      const puntos = [
