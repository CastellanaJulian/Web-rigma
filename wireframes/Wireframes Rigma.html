<script type="text/babel">

const W = 768;

const SK = {
  bg: '#faf8f4',
  dark: '#1e1e1e',
  mid: '#888',
  light: '#ccc',
  lighter: '#e8e4de',
  border: '#b5b0a8',
  ink: '#2d2b28',
};

// ── Primitives ──────────────────────────────────────────────────────────────

function ImgBox({ x, y, w, h, label, dark = false, angle = 45 }) {
  const id = `hatch_${x}_${y}_${w}`;
  const lineColor = dark ? '#555' : '#ccc';
  const bgColor = dark ? '#2a2a2a' : '#e0dcd5';
  return (
    <g>
      <defs>
        <pattern id={id} patternUnits="userSpaceOnUse" width="10" height="10" patternTransform={`rotate(${angle})`}>
          <line x1="0" y1="0" x2="0" y2="10" stroke={lineColor} strokeWidth="1.5" />
        </pattern>
      </defs>
      <rect x={x} y={y} width={w} height={h} fill={bgColor} rx="2" />
      <rect x={x} y={y} width={w} height={h} fill={`url(#${id})`} rx="2" />
      <rect x={x} y={y} width={w} height={h} fill="none" stroke={dark ? '#444' : SK.border} strokeWidth="1.5" rx="2" />
      {label && <text x={x + w / 2} y={y + h / 2 + 5} textAnchor="middle" fontFamily="'DM Mono',monospace" fontSize="10" fill={dark ? '#777' : SK.mid}>{label}</text>}
    </g>
  );
}

function Lbl({ x, y, t, size = 14, w = 400, color = SK.ink, anchor = 'start', opacity = 1 }) {
  return <text x={x} y={y} textAnchor={anchor} fontFamily="'Caveat',cursive" fontSize={size} fontWeight={w} fill={color} opacity={opacity}>{t}</text>;
}

function Bar({ x, y, width, h = 8, opacity = 0.25 }) {
  return <rect x={x} y={y} width={width} height={h} rx="3" fill={SK.dark} opacity={opacity} />;
}

function Btn({ x, y, bw, bh = 32, label, solid = true }) {
  return (
    <g>
      <rect x={x} y={y} width={bw} height={bh} rx="3" fill={solid ? SK.dark : 'none'} stroke={solid ? SK.dark : SK.border} strokeWidth="1.5" />
      <text x={x + bw / 2} y={y + bh / 2 + 5} textAnchor="middle" fontFamily="'Caveat',cursive" fontSize={13} fontWeight={600} fill={solid ? '#fff' : SK.dark}>{label}</text>
    </g>
  );
}

function Tag({ x, y, label, filled = false }) {
  const tw = label.length * 7.5 + 14;
  return (
    <g>
      <rect x={x} y={y} width={tw} height={22} rx="11" fill={filled ? SK.dark : 'none'} stroke={filled ? SK.dark : SK.border} strokeWidth="1.2" />
      <text x={x + tw / 2} y={y + 14} textAnchor="middle" fontFamily="'Caveat',cursive" fontSize={11} fill={filled ? '#fff' : SK.mid}>{label}</text>
    </g>
  );
}

function Note({ x, y, t, bw = 130 }) {
  return (
    <g opacity={0.7}>
      <rect x={x} y={y - 13} width={bw} height={17} rx="8" fill="#ffe066" />
      <text x={x + bw / 2} y={y} textAnchor="middle" fontFamily="'DM Mono',monospace" fontSize={9} fill="#7a6a00" letterSpacing="0.2">{t}</text>
    </g>
  );
}

function Div({ x, y, dw, dashed = false }) {
  return <line x1={x} y1={y} x2={x + dw} y2={y} stroke={SK.border} strokeWidth="1" strokeDasharray={dashed ? '5,4' : undefined} opacity={0.6} />;
}

// ── Navbars ──────────────────────────────────────────────────────────────────

function NavOverlay({ y = 0 }) {
  return (
    <g>
      <Lbl x={28} y={y + 36} t="RIGMA" size={20} w={700} color="#fff" />

}

function NavSolid({ y = 0 }) {

function Footer({ y }) {
